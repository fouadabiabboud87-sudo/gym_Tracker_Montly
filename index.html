<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypertrophy Progress Tracker</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #00e676;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 80px;
        }

        h2, h3 { margin: 5px 0; }

        /* Timer Header */
        .timer-header {
            position: sticky;
            top: 0;
            background-color: #000;
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .timer-display {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
            font-family: monospace;
        }

        .timer-btn {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Calendar Section */
        .calendar-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .date-picker-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="date"] {
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
        }

        /* Day Selector */
        .day-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .day-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .day-btn.active {
            border-color: var(--primary-color);
            background-color: #1a3826;
            color: var(--primary-color);
        }

        /* Exercise Card */
        .exercise-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .exercise-title {
            color: var(--primary-color);
            font-size: 16px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .exercise-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        /* Set Row */
        .set-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .set-label {
            width: 50px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        input[type="number"] {
            width: 65px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }

        .unit {
            font-size: 12px;
            color: var(--text-muted);
        }

        .save-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Rest Timer -->
    <div class="timer-header">
        <div>
            <div style="font-size: 10px; color: var(--text-muted);">REST TIMER</div>
            <div class="timer-display" id="timerDisplay">01:00</div>
        </div>
        <div>
            <button class="timer-btn" onclick="toggleTimer()" id="timerStartBtn">Start</button>
            <button class="timer-btn" style="background-color: #444; color: #fff;" onclick="resetTimer()">Reset</button>
        </div>
    </div>

    <!-- Calendar Log Header -->
    <div class="calendar-card">
        <div class="date-picker-row">
            <div>
                <span style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">SELECT DATE</span>
                <input type="date" id="workoutDate" onchange="loadDateData()">
            </div>
            <div id="loggedBadge" style="font-size: 13px; color: var(--primary-color); font-weight: bold; display: none;">✓ Logged</div>
        </div>
    </div>

    <!-- Workout Program Selector -->
    <div class="day-selector">
        <button class="day-btn active" onclick="selectDay(0)">Day 1: Upper A</button>
        <button class="day-btn" onclick="selectDay(1)">Day 2: Lower A</button>
        <button class="day-btn" onclick="selectDay(2)">Day 3: Upper B</button>
        <button class="day-btn" onclick="selectDay(3)">Day 4: Lower B</button>
    </div>

    <!-- Exercise Fields Container -->
    <div id="exerciseContainer"></div>

    <button class="save-btn" onclick="saveWorkout()">Save Log for Selected Date</button>

    <script>
        const workouts = [
            {
                name: "Day 1: Upper A",
                exercises: [
                    { name: "Smith Machine Incline Bench Press", sets: 3, target: "6-8 reps" },
                    { name: "Matrix Lat Pulldown", sets: 3, target: "8-10 reps" },
                    { name: "Seated Dumbbell Shoulder Press", sets: 3, target: "8-10 reps" },
                    { name: "Matrix Seated Chest Press", sets: 3, target: "10-12 reps" },
                    { name: "Dumbbell Single-Arm Row", sets: 3, target: "10-12 reps" },
                    { name: "DB Bicep Curls / Overhead Ext.", sets: 3, target: "12-15 reps" }
                ]
            },
            {
                name: "Day 2: Lower A",
                exercises: [
                    { name: "Smith Machine Back Squats", sets: 3, target: "6-8 reps" },
                    { name: "Matrix Leg Extensions", sets: 3, target: "10-12 reps" },
                    { name: "45-Deg Back Extensions", sets: 3, target: "10-12 reps" },
                    { name: "Matrix Seated Leg Curls", sets: 3, target: "12-15 reps" },
                    { name: "Dumbbell Standing Calf Raises", sets: 4, target: "12-15 reps" },
                    { name: "Ab Wheel / Leg Raises", sets: 3, target: "10-12 reps" }
                ]
            },
            {
                name: "Day 3: Upper B",
                exercises: [
                    { name: "Flat Dumbbell Bench Press", sets: 3, target: "8-10 reps" },
                    { name: "Matrix Seated Cable Row", sets: 3, target: "10-12 reps" },
                    { name: "Dumbbell Lateral Raises", sets: 4, target: "12-15 reps" },
                    { name: "Dumbbell Incline Chest Flyes", sets: 3, target: "12-15 reps" },
                    { name: "Dumbbell Rear Delt Flyes", sets: 3, target: "15 reps" },
                    { name: "Hammer Curls / Skullcrushers", sets: 3, target: "12 reps" }
                ]
            },
            {
                name: "Day 4: Lower B",
                exercises: [
                    { name: "Smith Machine RDLs", sets: 3, target: "8-10 reps" },
                    { name: "Matrix Seated Leg Curls", sets: 3, target: "10-12 reps" },
                    { name: "Bulgarian Split Squats", sets: 3, target: "8-10 reps" },
                    { name: "Matrix Leg Extensions", sets: 3, target: "12-15 reps" },
                    { name: "Dumbbell Goblet Squats", sets: 3, target: "12-15 reps" },
                    { name: "Calf Raises / Russian Twists", sets: 3, target: "15-20 reps" }
                ]
            }
        ];

        let currentDayIndex = 0;
        let timerSeconds = 60;
        let timerInterval = null;

        // Set default date picker to today YYYY-MM-DD
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('workoutDate').value = todayStr;

        function selectDay(index) {
            currentDayIndex = index;
            document.querySelectorAll('.day-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            renderWorkoutForm();
        }

        function renderWorkoutForm() {
            const container = document.getElementById('exerciseContainer');
            container.innerHTML = '';
            const selectedDate = document.getElementById('workoutDate').value;

            // Retrieve saved data for selected date and day program
            const savedData = JSON.parse(localStorage.getItem(`workout_${selectedDate}_d${currentDayIndex}`) || '{}');
            
            const badge = document.getElementById('loggedBadge');
            badge.style.display = Object.keys(savedData).length > 0 ? 'inline' : 'none';

            const day = workouts[currentDayIndex];
            day.exercises.forEach((ex, exIdx) => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                
                let setsHTML = '';
                for (let s = 1; s <= ex.sets; s++) {
                    const weightVal = savedData[`e${exIdx}_s${s}_w`] || '';
                    const repsVal = savedData[`e${exIdx}_s${s}_r`] || '';

                    setsHTML += `
                        <div class="set-row">
                            <span class="set-label">Set ${s}</span>
                            <div class="input-group">
                                <input type="number" placeholder="0" id="w_${exIdx}_${s}" value="${weightVal}">
                                <span class="unit">kg</span>
                            </div>
                            <div class="input-group">
                                <input type="number" placeholder="0" id="r_${exIdx}_${s}" value="${repsVal}">
                                <span class="unit">reps</span>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="exercise-title">${ex.name}</div>
                    <div class="exercise-subtitle">${ex.sets} Sets • Target: ${ex.target}</div>
                    ${setsHTML}
                `;
                container.appendChild(card);
            });
        }

        function saveWorkout() {
            const selectedDate = document.getElementById('workoutDate').value;
            if (!selectedDate) {
                alert('Please select a date.');
                return;
            }

            const day = workouts[currentDayIndex];
            const logObj = {};

            day.exercises.forEach((ex, exIdx) => {
                for (let s = 1; s <= ex.sets; s++) {
                    const wElem = document.getElementById(`w_${exIdx}_${s}`);
                    const rElem = document.getElementById(`r_${exIdx}_${s}`);
                    if (wElem && wElem.value !== '') logObj[`e${exIdx}_s${s}_w`] = wElem.value;
                    if (rElem && rElem.value !== '') logObj[`e${exIdx}_s${s}_r`] = rElem.value;
                }
            });

            localStorage.setItem(`workout_${selectedDate}_d${currentDayIndex}`, JSON.stringify(logObj));
            document.getElementById('loggedBadge').style.display = 'inline';
            alert(`Workout logged successfully for ${selectedDate}!`);
        }

        function loadDateData() {
            renderWorkoutForm();
        }

        /* Rest Timer Logic */
        function toggleTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                document.getElementById('timerStartBtn').innerText = 'Start';
            } else {
                document.getElementById('timerStartBtn').innerText = 'Pause';
                timerInterval = setInterval(() => {
                    timerSeconds--;
                    updateTimerDisplay();
                    if (timerSeconds <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        document.getElementById('timerStartBtn').innerText = 'Start';
                        alert("60 Seconds Rest Finished!");
                        resetTimer();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            timerSeconds = 60;
            document.getElementById('timerStartBtn').innerText = 'Start';
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
            const secs = String(timerSeconds % 60).padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
        }

        // Initialize workout container on load
        window.onload = function() {
            renderWorkoutForm();
        };
    </script>
</body>
</html>
